<style>
  :root {
    --bg: #F8F6F1;
    --surface: #FFFFFF;
    --border: #E2DDD3;
    --text: #26332E;
    --muted: #52615B;
    --primary: #234D3C;
    --primary-hover: #1B3D2F;
    --gold: #C5A46D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.015em; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .hidden { display: none !important; }
  .site-header { background: rgba(248, 246, 241, 0.96); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 28px; height: 72px; }
  .brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--primary); text-decoration: none; white-space: nowrap; }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
  .nav-links a:hover { color: var(--primary); }
  .btn { border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding: 64px 24px; align-items: center; }
  .kicker { font-size: 0.78rem; font-weight: 600; color: var(--primary); letter-spacing: 0.08em; margin-bottom: 10px; }
  .hero h1 { font-size: clamp(2.1rem, 3.6vw, 3.2rem); line-height: 1.12; margin-bottom: 12px; color: var(--text); }
  .tagline { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.25rem; color: var(--primary); margin-bottom: 14px; }
  .subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 24px; max-width: 58ch; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-card, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .metric-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .metric-box .label { display: block; font-size: 0.78rem; color: var(--muted); }
  .section { padding: 52px 24px; border-top: 1px solid var(--border); }
  .section h2 { font-size: 1.85rem; margin-bottom: 18px; }
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .card p { color: var(--muted); font-size: 0.92rem; }
  .form-grid { display: grid; gap: 12px; max-width: 520px; }
  .form-grid input, .form-grid textarea { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; background: #fff; }
  .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 120px); }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); padding: 0 12px 10px; }
  .side-link { text-align: left; background: transparent; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .side-link.active, .side-link:hover { background: #EBF1EC; color: var(--primary); }
  .admin-main { padding: 28px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); margin-top: 16px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  th { background: #F1EFEA; font-weight: 600; }
  .site-footer { background: var(--primary); color: #F8F6F1; padding: 24px 0; margin-top: 40px; }
  .footer-inner { display: flex; justify-content: space-between; font-size: 0.85rem; opacity: 0.92; }
  @media (max-width: 900px) {
    .hero, .feature-grid, .admin-shell { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
</style>
